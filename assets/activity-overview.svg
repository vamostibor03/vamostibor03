<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Contribution Activity Overview</title>
  <desc id="desc">Radar-style contribution split across commits, pull requests, code review, and issues.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .line { stroke: #1f883d; stroke-width: 3; stroke-linecap: round; }
      .shape { fill: #2da44e; fill-opacity: 0.26; stroke: #1f883d; stroke-width: 3; }
      .dot { fill: #ffffff; stroke: #1f883d; stroke-width: 3; }
      .label { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 30px; }
      .small { fill: #57606a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 24px; }
      .title { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="520" rx="0" />
  <rect class="card" x="5" y="5" width="970" height="510" rx="10" />

  <text x="36" y="64" class="title">Activity overview</text>
  <line x1="485" y1="82" x2="485" y2="490" stroke="#d0d7de" stroke-width="1" />

  <!-- Radar center and axes -->
  <line class="line" x1="740" y1="136" x2="740" y2="430" />
  <line class="line" x1="620" y1="280" x2="860" y2="280" />

  <!-- Data polygon
       commits 40% (left axis)
       pull requests 58% (down axis)
       code review 2% (up axis)
       issues 0% (right axis)
  -->
  <polygon class="shape" points="692,280 740,285 740,365 740,280" />

  <!-- Center and data points -->
  <circle class="dot" cx="740" cy="280" r="5" />
  <circle class="dot" cx="692" cy="280" r="5" />
  <circle class="dot" cx="740" cy="285" r="5" />
  <circle class="dot" cx="740" cy="365" r="5" />
  <circle class="dot" cx="740" cy="280" r="5" />

  <!-- Labels -->
  <text x="740" y="96" text-anchor="middle" class="label">2%</text>
  <text x="740" y="128" text-anchor="middle" class="label">Code review</text>

  <text x="892" y="286" class="label">Issues</text>

  <text x="574" y="280" text-anchor="middle" class="label">40%</text>
  <text x="574" y="314" text-anchor="middle" class="label">Commits</text>

  <text x="740" y="392" text-anchor="middle" class="label">58%</text>
  <text x="740" y="426" text-anchor="middle" class="label">Pull requests</text>

  <text x="36" y="130" class="small">Contributed to private and organizational repositories</text>
</svg>
